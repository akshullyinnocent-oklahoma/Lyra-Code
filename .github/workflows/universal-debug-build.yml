name: Universal Android Debug Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build armv7a Debug APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java & Cache Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Create Missing Server Key Placeholder
        run: |
          mkdir -p app/src/main/res/raw
          touch app/src/main/res/raw/lyra_mini_server

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Build APK (armeabi-v7a only)
        run: ./gradlew assembleDebug -Pandroid.injected.abi=armeabi-v7a --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-output
          path: "**/build/outputs/apk/**/*.apk"
